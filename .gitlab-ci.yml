stages:
  - mirror

mirror-github:
  stage: mirror
  tags:
    - vps
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $GITHUB_TREETANK_TOKEN'
    - when: never
  variables:
    GIT_STRATEGY: clone
    GIT_DEPTH: 0
  script:
    - git checkout -B main "$CI_COMMIT_SHA"
    - git push --force "https://${GITHUB_TREETANK_TOKEN}@github.com/treetank-net/google-analytics-baby.git" main
    - git push --force --tags "https://${GITHUB_TREETANK_TOKEN}@github.com/treetank-net/google-analytics-baby.git"
